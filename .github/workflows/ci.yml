name: Godot CI

on:
  push:
    branches:
      - main
      - fourplayer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR:|ERROR:" import.log; then
            echo "Godot reported an error while importing the project."
            exit 1
          fi

      - name: Smoke-test startup
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 120 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR:|ERROR:" smoke.log; then
            echo "Godot reported an error while running the project."
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            import.log
            smoke.log
          if-no-files-found: ignore
          retention-days: 7

  export:
    name: Export ${{ matrix.preset }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            output: build/linux/jump_junkies.x86_64
            artifact: jump-junkies-linux
          - preset: Windows Desktop
            output: build/windows/jump_junkies.exe
            artifact: jump-junkies-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --import

      - name: Export release build
        shell: bash
        run: |
          mkdir -p "$(dirname '${{ matrix.output }}')"
          godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}*
          if-no-files-found: error
